<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabuadas do Pedro">
<title>Tabuadas do Pedro 🎮</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TABUADAS DO PEDRO — Pixel-art kids math PWA
   ============================================================ */

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #0f0c29;
  --bg-mid: #302b63;
  --gold: #ffd700;
  --gold-dark: #c9a300;
  --red: #ff3b3b;
  --red-dark: #b32424;
  --green: #4ade80;
  --green-dark: #16a34a;
  --blue: #38bdf8;
  --blue-dark: #0284c7;
  --purple: #a855f7;
  --pink: #ec4899;
  --orange: #fb923c;
  --white: #ffffff;
  --dark: #1a1a2e;
  --shadow: 4px 4px 0 rgba(0,0,0,0.4);
  --shadow-lg: 6px 6px 0 rgba(0,0,0,0.5);
  /* Robust font stacks — works even if Google Fonts fail */
  --font-pixel: 'Press Start 2P', 'Courier New', Courier, ui-monospace, monospace;
  --font-body: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
}

html, body {
  width: 100%;
  min-height: 100%;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

body {
  font-family: var(--font-body);
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, #4a3f8c 0%, transparent 70%),
    radial-gradient(ellipse 80% 60% at 50% 100%, #2d1b4e 0%, transparent 70%),
    linear-gradient(180deg, #0f0c29 0%, #24243e 50%, #302b63 100%);
  background-attachment: fixed;
  color: var(--white);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ============ APP CONTAINER ============ */
#app {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top));
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}

/* Animated background stars */
.bg-stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}
.bg-star {
  position: absolute;
  background: white;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  animation: twinkle 3s infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

/* ============ SCREENS ============ */
.screen {
  display: none;
  position: relative;
  z-index: 1;
  flex-direction: column;
  gap: 16px;
}
.screen.active {
  display: flex;
  animation: screenIn 0.3s ease-out;
}
@keyframes screenIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ HOME SCREEN ============ */
.logo {
  text-align: center;
  margin-top: 10px;
}
.logo-title {
  font-family: var(--font-pixel);
  font-size: clamp(22px, 7vw, 36px);
  color: var(--gold);
  text-shadow:
    3px 3px 0 var(--red),
    6px 6px 0 var(--dark),
    0 0 20px rgba(255,215,0,0.5);
  margin-bottom: 14px;
  animation: bounce 2s ease-in-out infinite;
  line-height: 1.4;
}
.logo-subtitle {
  font-family: var(--font-pixel);
  font-size: clamp(11px, 3.2vw, 16px);
  color: var(--blue);
  text-shadow: 2px 2px 0 var(--dark);
  letter-spacing: 1px;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.hero {
  text-align: center;
  font-size: clamp(70px, 18vw, 110px);
  filter: drop-shadow(0 8px 0 rgba(0,0,0,0.4));
  animation: float 3s ease-in-out infinite;
  line-height: 1;
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-10px) rotate(3deg); }
}

.stats {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.stat {
  background: var(--dark);
  border: 3px solid var(--gold);
  padding: 10px 14px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow);
  font-family: var(--font-pixel);
  font-size: 12px;
  color: var(--gold);
}
.stat .icon { font-size: 18px; }
.stat.stars { border-color: var(--purple); color: var(--purple); }
.stat.streak { border-color: var(--orange); color: var(--orange); }

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 8px;
}

.menu-btn {
  background: var(--blue);
  border: 4px solid var(--dark);
  padding: 22px 12px;
  color: white;
  font-family: var(--font-pixel);
  font-size: 11px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.1s, box-shadow 0.1s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  line-height: 1.5;
  min-height: 130px;
  justify-content: center;
}
.menu-btn:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 rgba(0,0,0,0.4);
}
.menu-btn .emoji {
  font-size: 40px;
  line-height: 1;
}
.menu-btn.adventure { background: var(--red); }
.menu-btn.training { background: var(--green); }
.menu-btn.boss { background: var(--purple); }
.menu-btn.collection { background: var(--orange); }

.install-btn {
  margin-top: 16px;
  background: var(--gold);
  color: var(--dark);
  border: 4px solid var(--dark);
  padding: 14px 20px;
  font-family: var(--font-pixel);
  font-size: 11px;
  cursor: pointer;
  box-shadow: var(--shadow);
  align-self: center;
  display: none;
}
.install-btn.show { display: inline-block; }

/* ============ TOP BAR ============ */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.back-btn {
  background: var(--red);
  border: 3px solid var(--dark);
  color: white;
  width: 50px;
  height: 50px;
  font-family: var(--font-pixel);
  font-size: 16px;
  cursor: pointer;
  box-shadow: var(--shadow);
  flex-shrink: 0;
}
.back-btn:active { transform: translate(2px, 2px); box-shadow: none; }

.screen-title {
  font-family: var(--font-pixel);
  font-size: clamp(13px, 4vw, 17px);
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--dark);
  flex: 1;
  text-align: center;
}

.spacer { width: 50px; flex-shrink: 0; }

/* ============ ADVENTURE WORLDS ============ */
.world-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 14px;
  padding: 6px 0;
}

.world-card {
  background: var(--dark);
  border: 4px solid var(--blue);
  padding: 14px 8px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.1s;
  position: relative;
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
}
.world-card:active { transform: translate(2px, 2px); }
.world-card.locked { opacity: 0.4; cursor: not-allowed; border-color: #555; }
.world-card.completed { border-color: var(--gold); background: linear-gradient(135deg, #4a3f00, #1a1a2e); }
.world-emoji { font-size: 36px; filter: drop-shadow(0 3px 0 rgba(0,0,0,0.4)); line-height: 1; }
.world-num {
  font-family: var(--font-pixel);
  font-size: 18px;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--dark);
}
.world-stars {
  display: flex;
  gap: 2px;
  font-size: 14px;
}
.world-lock {
  position: absolute;
  top: 4px;
  right: 4px;
  font-size: 18px;
}

/* ============ TRAINING ============ */
.training-prompt {
  font-family: var(--font-pixel);
  text-align: center;
  font-size: 12px;
  color: var(--blue);
  margin: 10px 0;
}
.training-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
  gap: 10px;
}
.training-btn {
  background: var(--purple);
  border: 4px solid var(--dark);
  color: white;
  padding: 16px 8px;
  font-family: var(--font-pixel);
  font-size: 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
  text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.training-btn:active { transform: translate(2px, 2px); box-shadow: none; }
.training-mixed-btn {
  background: var(--pink);
  border: 4px solid var(--dark);
  color: white;
  padding: 18px 12px;
  font-family: var(--font-pixel);
  font-size: 12px;
  cursor: pointer;
  box-shadow: var(--shadow);
  text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 10px auto 0;
  max-width: 320px;
  width: 100%;
}
.training-mixed-btn:active { transform: translate(2px, 2px); box-shadow: none; }
.training-mixed-btn .emoji { font-size: 28px; }

/* ============ GAME SCREEN ============ */
.game-hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-pixel);
  font-size: 11px;
  flex-wrap: wrap;
  gap: 8px;
}
.hud-item {
  background: var(--dark);
  border: 3px solid var(--gold);
  padding: 8px 12px;
  box-shadow: var(--shadow);
}
.hud-item.lives { border-color: var(--red); color: var(--red); }
.hud-item.score { border-color: var(--gold); color: var(--gold); }
.hud-item.progress { border-color: var(--green); color: var(--green); }

.progress-bar {
  width: 100%;
  height: 16px;
  background: var(--dark);
  border: 3px solid var(--gold);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green), var(--gold));
  transition: width 0.3s;
  width: 0%;
}

.timer-bar {
  width: 100%;
  height: 20px;
  background: var(--dark);
  border: 3px solid var(--red);
  overflow: hidden;
  display: none;
}
.timer-bar.show { display: block; }
.timer-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), var(--orange));
  transition: width 0.1s linear;
  width: 100%;
}

.question-card {
  background: linear-gradient(135deg, #ffd700 0%, #ffb300 100%);
  border: 6px solid var(--dark);
  padding: 30px 20px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  animation: cardPop 0.4s ease-out;
}
@keyframes cardPop {
  0% { transform: scale(0.85) rotate(-3deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.question-text {
  font-family: var(--font-pixel);
  font-size: clamp(32px, 10vw, 52px);
  color: var(--dark);
  text-shadow: 3px 3px 0 var(--white);
  margin: 12px 0;
  line-height: 1.3;
}
.question-hint {
  font-family: var(--font-pixel);
  font-size: 11px;
  color: var(--dark);
  opacity: 0.7;
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.answer-btn {
  background: var(--blue);
  border: 4px solid var(--dark);
  color: white;
  padding: 26px 12px;
  font-family: var(--font-pixel);
  font-size: 24px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.1s;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
}
.answer-btn:active { transform: translate(3px, 3px); box-shadow: none; }
.answer-btn.correct { background: var(--green); animation: correctShake 0.5s; }
.answer-btn.wrong { background: var(--red); animation: wrongShake 0.5s; }
.answer-btn.disabled { pointer-events: none; opacity: 0.6; }
.answer-btn.reveal { background: var(--green); }
@keyframes correctShake {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.15) rotate(-3deg); }
  75% { transform: scale(1.15) rotate(3deg); }
}
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

/* ============ CONFIRM MODAL ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 20px;
  animation: modalFade 0.2s ease-out;
}
.modal-overlay.show { display: flex; }
@keyframes modalFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--dark);
  border: 5px solid var(--gold);
  box-shadow: var(--shadow-lg);
  padding: 28px 22px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  animation: modalPop 0.3s ease-out;
}
@keyframes modalPop {
  0% { transform: scale(0.7) rotate(-3deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.modal-icon {
  font-size: 50px;
  margin-bottom: 14px;
  line-height: 1;
}
.modal-title {
  font-family: var(--font-pixel);
  font-size: 14px;
  color: var(--gold);
  text-shadow: 2px 2px 0 var(--red);
  margin-bottom: 12px;
  line-height: 1.5;
}
.modal-msg {
  font-family: var(--font-pixel);
  font-size: 10px;
  color: var(--white);
  opacity: 0.85;
  line-height: 1.7;
  margin-bottom: 22px;
}
.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.modal-btn {
  background: var(--green);
  border: 4px solid var(--dark);
  color: white;
  padding: 14px 18px;
  font-family: var(--font-pixel);
  font-size: 11px;
  cursor: pointer;
  box-shadow: var(--shadow);
  text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  flex: 1;
  min-width: 110px;
}
.modal-btn:active { transform: translate(3px, 3px); box-shadow: none; }
.modal-btn.danger { background: var(--red); }

/* ============ FEEDBACK OVERLAY ============ */
.feedback-overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  pointer-events: none;
}
.feedback-overlay.show { display: flex; }
.feedback-text {
  font-family: var(--font-pixel);
  font-size: clamp(36px, 12vw, 64px);
  text-shadow: 4px 4px 0 var(--dark), 0 0 30px rgba(255,255,255,0.5);
  animation: feedbackPop 0.8s ease-out;
}
.feedback-text.correct { color: var(--green); }
.feedback-text.wrong { color: var(--red); }
@keyframes feedbackPop {
  0% { transform: scale(0.3); opacity: 0; }
  20% { transform: scale(1.3); opacity: 1; }
  80% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.5); opacity: 0; }
}

/* ============ RESULT SCREEN ============ */
.result {
  text-align: center;
  padding: 20px 10px;
}
.result-emoji {
  font-size: clamp(90px, 22vw, 150px);
  margin: 20px 0;
  animation: resultPop 0.6s ease-out;
  line-height: 1;
}
@keyframes resultPop {
  0% { transform: scale(0) rotate(-180deg); }
  100% { transform: scale(1) rotate(0); }
}
.result-title {
  font-family: var(--font-pixel);
  font-size: clamp(20px, 6vw, 30px);
  color: var(--gold);
  text-shadow: 3px 3px 0 var(--dark);
  margin: 18px 0;
}
.result-stars-row {
  font-size: clamp(40px, 11vw, 64px);
  margin: 18px 0;
  letter-spacing: 8px;
  line-height: 1;
}
.result-stat {
  font-family: var(--font-pixel);
  font-size: 13px;
  color: var(--white);
  margin: 10px 0;
}
.result-actions {
  display: flex;
  gap: 12px;
  margin-top: 24px;
  justify-content: center;
  flex-wrap: wrap;
}
.result-btn {
  background: var(--green);
  border: 4px solid var(--dark);
  color: white;
  padding: 14px 22px;
  font-family: var(--font-pixel);
  font-size: 11px;
  cursor: pointer;
  box-shadow: var(--shadow);
  text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
}
.result-btn:active { transform: translate(3px, 3px); box-shadow: none; }
.result-btn.secondary { background: var(--blue); }

/* ============ COLLECTION ============ */
.collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
  gap: 12px;
}
.badge {
  background: var(--dark);
  border: 4px solid #555;
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
  padding: 6px;
  text-align: center;
  gap: 4px;
}
.badge.unlocked {
  border-color: var(--gold);
  background: linear-gradient(135deg, #4a3f00 0%, #1a1a2e 100%);
}
.badge-emoji { font-size: 32px; line-height: 1; }
.badge.locked .badge-emoji { filter: grayscale(1) opacity(0.3); }
.badge-name {
  font-family: var(--font-pixel);
  font-size: 7px;
  color: var(--gold);
  line-height: 1.4;
}
.badge.locked .badge-name { color: #666; }

/* ============ ANIMATIONS ============ */
.coin-fly {
  position: fixed;
  font-size: 32px;
  pointer-events: none;
  z-index: 200;
  animation: coinFly 0.8s ease-out forwards;
}
@keyframes coinFly {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -300px) scale(0.3); opacity: 0; }
}
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  pointer-events: none;
  z-index: 150;
  animation: confettiFall 2s linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-100px) rotate(0); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ============ RESPONSIVE ============ */
@media (max-width: 360px) {
  #app { padding: 12px; }
  .menu { gap: 10px; }
  .menu-btn { padding: 16px 8px; min-height: 110px; }
  .menu-btn .emoji { font-size: 32px; }
}

@media (min-width: 768px) {
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  #app {
    box-shadow: 0 0 50px rgba(0,0,0,0.5);
    background: rgba(15, 12, 41, 0.4);
  }
}
</style>
</head>
<body>

<div class="bg-stars" id="bg-stars"></div>

<div id="app">

  <!-- ============ HOME SCREEN ============ -->
  <div class="screen active" id="screen-home">
    <div class="logo">
      <div class="logo-title">TABUADAS</div>
      <div class="logo-subtitle">★ DO PEDRO ★</div>
    </div>

    <div class="hero">🦸</div>

    <div class="stats">
      <div class="stat">
        <span class="icon">🪙</span>
        <span id="home-coins">0</span>
      </div>
      <div class="stat stars">
        <span class="icon">⭐</span>
        <span id="home-stars">0</span>
      </div>
      <div class="stat streak">
        <span class="icon">🔥</span>
        <span id="home-streak">0</span>
      </div>
    </div>

    <div class="menu">
      <button class="menu-btn adventure" onclick="goToAdventure()">
        <span class="emoji">🗺️</span>
        <span>AVENTURA</span>
      </button>
      <button class="menu-btn training" onclick="goToTraining()">
        <span class="emoji">🎯</span>
        <span>TREINO</span>
      </button>
      <button class="menu-btn boss" onclick="startBoss()">
        <span class="emoji">👹</span>
        <span>BOSS<br>FIGHT</span>
      </button>
      <button class="menu-btn collection" onclick="goToCollection()">
        <span class="emoji">🏆</span>
        <span>TROFÉUS</span>
      </button>
    </div>

    <button class="install-btn" id="install-btn" onclick="installApp()">
      📲 INSTALAR APP
    </button>
  </div>

  <!-- ============ ADVENTURE MAP ============ -->
  <div class="screen" id="screen-adventure">
    <div class="top-bar">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <div class="screen-title">AVENTURA</div>
      <div class="spacer"></div>
    </div>
    <div class="world-grid" id="world-grid"></div>
  </div>

  <!-- ============ TRAINING ============ -->
  <div class="screen" id="screen-training">
    <div class="top-bar">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <div class="screen-title">TREINO LIVRE</div>
      <div class="spacer"></div>
    </div>
    <div class="training-prompt">ESCOLHE A TABUADA</div>
    <div class="training-grid" id="training-grid"></div>
    <button class="training-mixed-btn" onclick="startTraining(0)">
      <span class="emoji">🎲</span>
      <span>MISTURA TUDO</span>
    </button>
  </div>

  <!-- ============ GAME SCREEN ============ -->
  <div class="screen" id="screen-game">
    <div class="top-bar">
      <button class="back-btn" onclick="quitGame()">✕</button>
      <div class="screen-title" id="game-title">TABUADA</div>
      <div class="spacer"></div>
    </div>

    <div class="game-hud">
      <div class="hud-item lives" id="hud-lives">❤️❤️❤️</div>
      <div class="hud-item score">🪙 <span id="hud-score">0</span></div>
      <div class="hud-item progress"><span id="hud-progress">1/10</span></div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="timer-bar" id="timer-bar">
      <div class="timer-fill" id="timer-fill"></div>
    </div>

    <div class="question-card">
      <div class="question-hint">QUANTO É?</div>
      <div class="question-text" id="question-text">3 × 4</div>
    </div>

    <div class="answers" id="answers"></div>
  </div>

  <!-- ============ RESULT SCREEN ============ -->
  <div class="screen" id="screen-result">
    <div class="result">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-title" id="result-title">VITÓRIA!</div>
      <div class="result-stars-row" id="result-stars">⭐⭐⭐</div>
      <div class="result-stat">PONTUAÇÃO: <span id="result-score">0</span></div>
      <div class="result-stat">ACERTOS: <span id="result-accuracy">0/0</span></div>
      <div class="result-stat">🪙 +<span id="result-coins">0</span> MOEDAS</div>
      <div class="result-actions">
        <button class="result-btn" onclick="replayGame()">🔁 OUTRA VEZ</button>
        <button class="result-btn secondary" onclick="showScreen('home')">🏠 INÍCIO</button>
      </div>
    </div>
  </div>

  <!-- ============ COLLECTION ============ -->
  <div class="screen" id="screen-collection">
    <div class="top-bar">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <div class="screen-title">TROFÉUS</div>
      <div class="spacer"></div>
    </div>
    <div class="collection-grid" id="collection-grid"></div>
  </div>

</div>

<div class="feedback-overlay" id="feedback-overlay">
  <div class="feedback-text" id="feedback-text"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-icon">🤔</div>
    <div class="modal-title">SAIR DO JOGO?</div>
    <div class="modal-msg">Vais perder o<br>progresso desta ronda!</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal()">CONTINUAR</button>
      <button class="modal-btn danger" onclick="confirmQuit()">SAIR</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// TABUADAS DO PEDRO — Math facts game
// ============================================================

const STORAGE_KEY = 'tabuadas-pedro-v1';
const DEFAULT_STATE = {
  coins: 0, totalStars: 0, streak: 0,
  worldStars: {}, worldCleared: {}, badges: {}, bossHighScore: 0,
};

let state = loadState();
let game = null;

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return Object.assign({}, DEFAULT_STATE, JSON.parse(saved));
  } catch (e) {}
  return Object.assign({}, DEFAULT_STATE);
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

const WORLDS = [
  { num: 1, emoji: '🌱', name: 'Pradaria' },
  { num: 2, emoji: '🌊', name: 'Oceano' },
  { num: 3, emoji: '🌋', name: 'Vulcão' },
  { num: 4, emoji: '🏰', name: 'Castelo' },
  { num: 5, emoji: '⭐', name: 'Estrelas' },
  { num: 6, emoji: '🌲', name: 'Floresta' },
  { num: 7, emoji: '🏜️', name: 'Deserto' },
  { num: 8, emoji: '❄️', name: 'Geleira' },
  { num: 9, emoji: '🌌', name: 'Galáxia' },
  { num: 10, emoji: '🌈', name: 'Arco-íris' },
];

const BADGES = [
  { id: 'firstWin', emoji: '🎖️', name: 'PRIMEIRA VITÓRIA' },
  { id: 'star10', emoji: '⭐', name: '10 ESTRELAS' },
  { id: 'star20', emoji: '🌟', name: '20 ESTRELAS' },
  { id: 'allWorlds', emoji: '🏆', name: 'TODOS MUNDOS' },
  { id: 'perfect', emoji: '💯', name: 'JOGO PERFEITO' },
  { id: 'streak5', emoji: '🔥', name: 'STREAK 5' },
  { id: 'streak10', emoji: '⚡', name: 'STREAK 10' },
  { id: 'boss50', emoji: '👹', name: 'BOSS 50+' },
  { id: 'rich', emoji: '💰', name: '500 MOEDAS' },
  { id: 'master2', emoji: '2️⃣', name: 'MESTRE DO 2' },
  { id: 'master5', emoji: '5️⃣', name: 'MESTRE DO 5' },
  { id: 'master10', emoji: '🔟', name: 'MESTRE DO 10' },
];

// ---------- AUDIO ----------
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}
function tone(freq, dur, type, vol) {
  const ctx = getAudioCtx(); if (!ctx) return;
  type = type || 'square'; vol = vol || 0.1;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + dur);
}
function sfxCorrect() { tone(523, 0.1); setTimeout(() => tone(659, 0.1), 80); setTimeout(() => tone(784, 0.15), 160); }
function sfxWrong() { tone(200, 0.2, 'sawtooth', 0.08); setTimeout(() => tone(150, 0.3, 'sawtooth', 0.08), 100); }
function sfxCoin() { tone(988, 0.08, 'square', 0.08); setTimeout(() => tone(1318, 0.12, 'square', 0.08), 60); }
function sfxStar() {
  tone(523, 0.08); setTimeout(() => tone(659, 0.08), 80);
  setTimeout(() => tone(784, 0.08), 160); setTimeout(() => tone(1047, 0.2), 240);
}
function sfxClick() { tone(440, 0.05, 'square', 0.06); }

// ---------- BACKGROUND STARS ----------
function buildStars() {
  const container = document.getElementById('bg-stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'bg-star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.opacity = Math.random() * 0.6 + 0.2;
    container.appendChild(s);
  }
}

// ---------- NAVIGATION ----------
function showScreen(name) {
  sfxClick();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + name);
  if (target) target.classList.add('active');
  window.scrollTo(0, 0);
  if (name === 'home') refreshHome();
  if (name === 'adventure') buildAdventure();
  if (name === 'training') buildTraining();
  if (name === 'collection') buildCollection();
}

function refreshHome() {
  document.getElementById('home-coins').textContent = state.coins;
  document.getElementById('home-stars').textContent = state.totalStars;
  document.getElementById('home-streak').textContent = state.streak;
}

// ---------- ADVENTURE ----------
function goToAdventure() { showScreen('adventure'); }
function buildAdventure() {
  const grid = document.getElementById('world-grid');
  grid.innerHTML = '';
  WORLDS.forEach((w, i) => {
    const stars = state.worldStars[w.num] || 0;
    const isLocked = i > 0 && !state.worldCleared[WORLDS[i-1].num];
    const isComplete = stars === 3;
    const card = document.createElement('div');
    card.className = 'world-card' + (isLocked ? ' locked' : '') + (isComplete ? ' completed' : '');
    card.innerHTML =
      '<div class="world-emoji">' + w.emoji + '</div>' +
      '<div class="world-num">' + w.num + '×</div>' +
      '<div class="world-stars">' + '⭐'.repeat(stars) + '☆'.repeat(3 - stars) + '</div>' +
      (isLocked ? '<div class="world-lock">🔒</div>' : '');
    if (!isLocked) card.onclick = () => startAdventure(w.num);
    grid.appendChild(card);
  });
}

// ---------- TRAINING ----------
function goToTraining() { showScreen('training'); }
function buildTraining() {
  const grid = document.getElementById('training-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'training-btn';
    btn.textContent = i + '×';
    btn.onclick = () => startTraining(i);
    grid.appendChild(btn);
  }
}

// ---------- COLLECTION ----------
function goToCollection() { showScreen('collection'); }
function buildCollection() {
  const grid = document.getElementById('collection-grid');
  grid.innerHTML = '';
  BADGES.forEach(b => {
    const unlocked = !!state.badges[b.id];
    const div = document.createElement('div');
    div.className = 'badge ' + (unlocked ? 'unlocked' : 'locked');
    div.innerHTML =
      '<div class="badge-emoji">' + (unlocked ? b.emoji : '❓') + '</div>' +
      '<div class="badge-name">' + (unlocked ? b.name : '???') + '</div>';
    grid.appendChild(div);
  });
}

// ---------- GAME ----------
function startAdventure(tabuada) {
  game = newGame({ mode: 'adventure', tabuada: tabuada, total: 10, lives: 3 });
  document.getElementById('game-title').textContent = 'TABUADA DO ' + tabuada;
  document.getElementById('timer-bar').classList.remove('show');
  showScreen('game');
  nextQuestion();
}
function startTraining(tabuada) {
  game = newGame({ mode: 'training', tabuada: tabuada, total: 10, lives: 99 });
  document.getElementById('game-title').textContent = tabuada === 0 ? 'MISTURA TUDO' : ('TREINO ' + tabuada + '×');
  document.getElementById('timer-bar').classList.remove('show');
  showScreen('game');
  nextQuestion();
}
function startBoss() {
  game = newGame({ mode: 'boss', tabuada: 0, total: 999, lives: 3, timeLimit: 60 });
  document.getElementById('game-title').textContent = 'BOSS FIGHT 👹';
  document.getElementById('timer-bar').classList.add('show');
  showScreen('game');
  game.bossEndTime = Date.now() + game.timeLimit * 1000;
  tickBoss();
  nextQuestion();
}

function newGame(opts) {
  return {
    mode: opts.mode, tabuada: opts.tabuada, total: opts.total,
    lives: opts.lives, timeLimit: opts.timeLimit || null,
    current: 0, score: 0, correct: 0, wrong: 0,
    history: [], answered: false, finished: false,
  };
}

function makeQuestion() {
  let a, b;
  if (game.tabuada > 0) {
    a = game.tabuada;
    b = Math.floor(Math.random() * 10) + 1;
  } else {
    a = Math.floor(Math.random() * 9) + 2;
    b = Math.floor(Math.random() * 10) + 1;
  }
  if (game.history.length && Math.random() < 0.3) {
    const w = game.history[Math.floor(Math.random() * game.history.length)];
    a = w.a; b = w.b;
  }
  const correct = a * b;
  const options = new Set([correct]);
  while (options.size < 4) {
    let delta = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
    let opt = correct + delta;
    if (opt < 0) opt = correct + Math.abs(delta) + a;
    if (opt !== correct && opt > 0) options.add(opt);
  }
  const arr = Array.from(options).sort(() => Math.random() - 0.5);
  return { a: a, b: b, correct: correct, options: arr };
}

function nextQuestion() {
  if (game.finished) return;
  if (game.mode !== 'boss' && game.current >= game.total) return endGame();
  if (game.lives <= 0) return endGame();
  game.current++;
  game.answered = false;
  const q = makeQuestion();
  game.q = q;
  document.getElementById('question-text').textContent = q.a + ' × ' + q.b;
  const grid = document.getElementById('answers');
  grid.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt;
    btn.onclick = () => answer(opt, btn);
    grid.appendChild(btn);
  });
  updateHUD();
}

function updateHUD() {
  document.getElementById('hud-lives').textContent = '❤️'.repeat(Math.max(0, game.lives));
  document.getElementById('hud-score').textContent = game.score;
  if (game.mode === 'boss') {
    document.getElementById('hud-progress').textContent = 'Q' + game.current;
  } else {
    document.getElementById('hud-progress').textContent = game.current + '/' + game.total;
    document.getElementById('progress-fill').style.width = ((game.current / game.total) * 100) + '%';
  }
}

function answer(value, btn) {
  if (game.answered) return;
  game.answered = true;
  const isCorrect = value === game.q.correct;
  document.querySelectorAll('.answer-btn').forEach(b => b.classList.add('disabled'));

  if (isCorrect) {
    btn.classList.add('correct');
    game.correct++;
    state.streak++;
    const points = game.mode === 'boss' ? 10 : 5;
    game.score += points;
    sfxCorrect();
    showFeedback('CERTO!', 'correct');
    spawnCoin(btn);
    state.coins++;
    saveState();
    setTimeout(nextQuestion, 900);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.answer-btn').forEach(b => {
      if (parseInt(b.textContent, 10) === game.q.correct) b.classList.add('reveal');
    });
    game.wrong++;
    game.lives--;
    state.streak = 0;
    game.history.push({ a: game.q.a, b: game.q.b });
    sfxWrong();
    showFeedback('= ' + game.q.correct, 'wrong');
    saveState();
    setTimeout(nextQuestion, 1800);
  }
  checkBadges();
}

function showFeedback(text, type) {
  const overlay = document.getElementById('feedback-overlay');
  const el = document.getElementById('feedback-text');
  el.textContent = text;
  el.className = 'feedback-text ' + type;
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 800);
}

function spawnCoin(fromEl) {
  const rect = fromEl.getBoundingClientRect();
  const coin = document.createElement('div');
  coin.className = 'coin-fly';
  coin.textContent = '🪙';
  coin.style.left = (rect.left + rect.width / 2) + 'px';
  coin.style.top = (rect.top + rect.height / 2) + 'px';
  document.body.appendChild(coin);
  sfxCoin();
  setTimeout(() => coin.remove(), 800);
}

function spawnConfetti() {
  const colors = ['#ffd700', '#ff3b3b', '#4ade80', '#38bdf8', '#a855f7', '#ec4899'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.animationDuration = (1.5 + Math.random()) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2500);
  }
}

function endGame() {
  if (game.finished) return;
  game.finished = true;
  const total = game.correct + game.wrong;
  const accuracy = total > 0 ? game.correct / total : 0;
  let stars = 0;
  let title = 'TENTA OUTRA VEZ!';
  let emoji = '😅';

  if (game.mode === 'adventure') {
    if (accuracy >= 0.95) { stars = 3; title = 'PERFEITO!'; emoji = '🌟'; }
    else if (accuracy >= 0.75) { stars = 2; title = 'MUITO BEM!'; emoji = '🎉'; }
    else if (accuracy >= 0.5) { stars = 1; title = 'BOM TRABALHO!'; emoji = '👍'; }
    else { stars = 0; title = 'QUASE!'; emoji = '💪'; }

    const prevStars = state.worldStars[game.tabuada] || 0;
    if (stars > prevStars) {
      state.totalStars += (stars - prevStars);
      state.worldStars[game.tabuada] = stars;
    }
    if (stars >= 1) state.worldCleared[game.tabuada] = true;
    if (accuracy === 1) state.badges.perfect = true;
    sfxStar();
  } else if (game.mode === 'boss') {
    title = 'BOSS FIGHT!';
    emoji = game.score >= 50 ? '👑' : '👹';
    if (game.score > state.bossHighScore) state.bossHighScore = game.score;
    if (game.score >= 50) state.badges.boss50 = true;
  } else {
    title = 'TREINO COMPLETO!';
    emoji = '🎯';
  }

  state.coins += game.score;
  if (state.coins >= 500) state.badges.rich = true;
  if (game.correct > 0) state.badges.firstWin = true;
  if (state.totalStars >= 10) state.badges.star10 = true;
  if (state.totalStars >= 20) state.badges.star20 = true;
  if (Object.keys(state.worldCleared).length >= WORLDS.length) state.badges.allWorlds = true;
  if (state.worldStars[2] === 3) state.badges.master2 = true;
  if (state.worldStars[5] === 3) state.badges.master5 = true;
  if (state.worldStars[10] === 3) state.badges.master10 = true;

  saveState();

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-stars').textContent =
    game.mode === 'adventure' ? '⭐'.repeat(stars) + '☆'.repeat(3 - stars) : '';
  document.getElementById('result-score').textContent = game.score;
  document.getElementById('result-accuracy').textContent = game.correct + '/' + total;
  document.getElementById('result-coins').textContent = game.score;
  showScreen('result');
  if (stars >= 2 || game.score >= 50) spawnConfetti();
}

function checkBadges() {
  if (state.streak >= 5) state.badges.streak5 = true;
  if (state.streak >= 10) state.badges.streak10 = true;
  saveState();
}

function replayGame() {
  if (!game) return showScreen('home');
  if (game.mode === 'adventure') startAdventure(game.tabuada);
  else if (game.mode === 'boss') startBoss();
  else startTraining(game.tabuada);
}

function quitGame() {
  sfxClick();
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() {
  sfxClick();
  document.getElementById('modal-overlay').classList.remove('show');
}
function confirmQuit() {
  document.getElementById('modal-overlay').classList.remove('show');
  showScreen('home');
}

function tickBoss() {
  if (!game || game.mode !== 'boss' || game.finished) return;
  const left = Math.max(0, game.bossEndTime - Date.now());
  const pct = (left / (game.timeLimit * 1000)) * 100;
  document.getElementById('timer-fill').style.width = pct + '%';
  if (left <= 0) { endGame(); return; }
  requestAnimationFrame(tickBoss);
}

// ---------- PWA INSTALL ----------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').classList.add('show');
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => {
    deferredPrompt = null;
    document.getElementById('install-btn').classList.remove('show');
  });
}

// ---------- SERVICE WORKER (only over http/https) ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ---------- INIT ----------
buildStars();
refreshHome();

document.addEventListener('touchstart', () => { getAudioCtx(); }, { once: true });
document.addEventListener('click', () => { getAudioCtx(); }, { once: true });
document.addEventListener('dblclick', (e) => e.preventDefault());
</script>
</body>
